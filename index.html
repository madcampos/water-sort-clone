<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Water Sort</title>
		<link rel="stylesheet" type="text/css" href="./css/index.css" />
	</head>
	<body>
		<main id="game-screen">
			<nav>
				<button type="button" data-level-select="current" aria-label="Reset level">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M21 11a1 1 0 0 0-1 1a8.05 8.05 0 1 1-2.22-5.5h-2.4a1 1 0 0 0 0 2h4.53a1 1 0 0 0 1-1V3a1 1 0 0 0-2 0v1.77A10 10 0 1 0 22 12a1 1 0 0 0-1-1"
						/>
					</svg>
				</button>
				<hr />
				<button type="button" aria-label="Open settings" data-settings>
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="m21.32 9.55l-1.89-.63l.89-1.78A1 1 0 0 0 20.13 6L18 3.87a1 1 0 0 0-1.15-.19l-1.78.89l-.63-1.89A1 1 0 0 0 13.5 2h-3a1 1 0 0 0-.95.68l-.63 1.89l-1.78-.89A1 1 0 0 0 6 3.87L3.87 6a1 1 0 0 0-.19 1.15l.89 1.78l-1.89.63a1 1 0 0 0-.68.94v3a1 1 0 0 0 .68.95l1.89.63l-.89 1.78A1 1 0 0 0 3.87 18L6 20.13a1 1 0 0 0 1.15.19l1.78-.89l.63 1.89a1 1 0 0 0 .95.68h3a1 1 0 0 0 .95-.68l.63-1.89l1.78.89a1 1 0 0 0 1.13-.19L20.13 18a1 1 0 0 0 .19-1.15l-.89-1.78l1.89-.63a1 1 0 0 0 .68-.94v-3a1 1 0 0 0-.68-.95M20 12.78l-1.2.4A2 2 0 0 0 17.64 16l.57 1.14l-1.1 1.1l-1.11-.6a2 2 0 0 0-2.79 1.16l-.4 1.2h-1.59l-.4-1.2A2 2 0 0 0 8 17.64l-1.14.57l-1.1-1.1l.6-1.11a2 2 0 0 0-1.16-2.82l-1.2-.4v-1.56l1.2-.4A2 2 0 0 0 6.36 8l-.57-1.11l1.1-1.1L8 6.36a2 2 0 0 0 2.82-1.16l.4-1.2h1.56l.4 1.2A2 2 0 0 0 16 6.36l1.14-.57l1.1 1.1l-.6 1.11a2 2 0 0 0 1.16 2.79l1.2.4ZM12 8a4 4 0 1 0 4 4a4 4 0 0 0-4-4m0 6a2 2 0 1 1 2-2a2 2 0 0 1-2 2"
						/>
					</svg>
				</button>
			</nav>
			<output id="status" aria-live="polite" class="visually-hidden"></output>
		</main>

		<dialog id="title-screen" aria-labelledby="title-label">
			<header>
				<h1 id="title-label">Water Sort</h1>
			</header>

			<div>
				<button type="button" data-level-select="current">Play</button>
				<button type="button" data-level-select="screen">Select level</button>
				<button data-settings>Game settings</button>
			</div>
		</dialog>

		<dialog id="settings-screen">
			<header>
				<h2>Game Settings</h2>
				<button type="button" aria-label="Close settings" data-settings="close">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="m13.41 12l4.3-4.29a1 1 0 1 0-1.42-1.42L12 10.59l-4.29-4.3a1 1 0 0 0-1.42 1.42l4.3 4.29l-4.3 4.29a1 1 0 0 0 0 1.42a1 1 0 0 0 1.42 0l4.29-4.3l4.29 4.3a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.42Z"
						/>
					</svg>
				</button>
			</header>

			<form id="settings-form">
				<p>
					<input type="checkbox" switch id="show-numbers" name="show-numbers" value="true" /> <label for="show-numbers">Show numbers for each flask section</label>
				</p>

				<fieldset>
					<legend>High contrast colours</legend>

					<p>
						<input type="radio" switch id="colorblind-mode" name="colorblind-mode" value="none" checked /> <label for="colorblind-mode">Don't change colours</label>
					</p>

					<p>
						<input type="radio" switch id="colorblind-mode2" name="colorblind-mode" value="pattern" />
						<label for="colorblind-mode2">Show different patterns for each colour</label>
					</p>

					<p>
						<input type="radio" switch id="colorblind-mode3" name="colorblind-mode" value="shades" />
						<label for="colorblind-mode3">Show different shades of gray for each colour</label>
					</p>
				</fieldset>
			</form>
		</dialog>

		<dialog id="game-over-screen" aria-labelledby="game-over-label">
			<header>
				<h2 id="game-over-label">Level complete!</h2>
			</header>

			<div>
				<button type="button" data-level-select="next">Next level</button>
				<button type="button" data-level-select="screen">Select level</button>
			</div>
		</dialog>

		<dialog id="level-select-screen" aria-labelledby="level-select-label">
			<header>
				<h2 id="level-select-label">Select Level</h2>
			</header>
		</dialog>

		<script src="./js/index.js" type="module"></script>
	</body>
</html>
