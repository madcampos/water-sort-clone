<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Water Sort</title>
    <link rel="stylesheet" type="text/css" href="./art.css" />
  </head>
  <body>
    <h1>Water Sort</h1>
    <nav>
      <button type="button" id="settings-button" aria-label="Settings" popovertarget="settings-dialog">⚙️</button>
      <dialog id="settings-dialog" popover>
        <header>
          <h2>Settings</h2>
          <button type="button" aria-label="Close window" popovertarget="settings-dialog">❌</button>
        </header>

        <form id="settings-form">
          <p>
            <input type="checkbox" switch id="show-numbers" name="show-numbers" value="true" />
            <label for="show-numbers">Show numbers for each flask section</label>
          </p>

          <fieldset>
            <legend>High contrast colours</legend>

            <p>
              <input type="radio" switch id="colorblind-mode" name="colorblind-mode" value="none" checked />
              <label for="colorblind-mode">Don't change colours</label>
            </p>

            <p>
              <input type="radio" switch id="colorblind-mode2" name="colorblind-mode" value="pattern" />
              <label for="colorblind-mode2">Show different patterns for each colour</label>
            </p>

            <p>
              <input type="radio" switch id="colorblind-mode3" name="colorblind-mode" value="shades" />
              <label for="colorblind-mode3">Show different shades of gray for each colour</label>
            </p>
          </fieldset>

        </form>
      </dialog>
    </nav>

    <output id="status" aria-live="polite" class="visually-hidden"></output>

    <div id="flasks">
    </div>

    <dialog id="game-over" aria-label="You won!">
      <h2>You won!!!</h2>
    </dialog>

    <script src="./index.js" type="module" async defer></script>
  </body>
</html>
